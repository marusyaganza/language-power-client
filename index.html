<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Mantine's ColorSchemeScript: apply the last used scheme before first paint (no flash). -->
    <script>
      try {
        var stored = localStorage.getItem("mantine-color-scheme-value");
        var scheme = stored === "light" || stored === "dark" ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="description" content="Language Power — search a dictionary, build your vocabulary and practice it with spaced-repetition games." />
    <title>Language Power</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
