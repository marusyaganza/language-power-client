[build]
  # Both sites (personal and demo) build from this repo, so the API's address comes from each site's
  # API_ORIGIN variable (e.g. https://py-lp-api-463683887111.us-east5.run.app). netlify.toml can't read
  # variables itself, but [[redirects]] and [[headers]] are read after the build, so the command
  # writes it in. `:?` fails the build when the variable is missing, instead of proxying to nowhere.
  command = "sed -i \"s|API_ORIGIN_PLACEHOLDER|${API_ORIGIN:?Set API_ORIGIN in the Netlify site settings}|g\" netlify.toml && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Tags error reports by deploy type. The DSN, auth token, org and project are set in Netlify's UI.
[context.production.environment]
  VITE_SENTRY_ENVIRONMENT = "production"

[context.deploy-preview.environment]
  VITE_SENTRY_ENVIRONMENT = "deploy-preview"

[context.branch-deploy.environment]
  VITE_SENTRY_ENVIRONMENT = "branch-deploy"

# The browser only talks to this site: /api/* is proxied (status 200, not a redirect) to Cloud Run
# without the /api prefix, so the session cookie stays first-party and there is no CORS.
# Must come before the SPA fallback; Netlify uses the first matching rule.
# `signed`: Netlify adds an X-Nf-Sign header signed with the secret in that environment variable,
# and the API rejects requests without a valid one, so it can only be reached through this site.
[[redirects]]
  from = "/api/*"
  to = "API_ORIGIN_PLACEHOLDER/:splat"   # replaced by the build command
  status = 200
  force = true
  signed = "API_SIGNATURE_TOKEN"   # the variable's NAME, not the secret itself

# /sentry (error reports) is proxied by a rule in dist/_redirects, which the build writes from
# VITE_SENTRY_DSN (see vite.config.js), so the DSN isn't kept in the repo. _redirects rules run first.

# Single-page app: every other path serves index.html and React Router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. The CSP allows only this site's own scripts and requests
# (the API and the Sentry tunnel are same-origin), Google Fonts, and images and audio from any https:
# host, since users can add their own picture and audio links. 'unsafe-inline' styles: Mantine sets
# CSS variables in style attributes and <style> tags at runtime.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob: https:; \
      media-src 'self' blob: https:; \
      connect-src 'self'; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'"""
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No other window (e.g. one that opened this site) keeps a reference to it.
    Cross-Origin-Opener-Policy = "same-origin"

# Built assets have content hashes in their names, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
